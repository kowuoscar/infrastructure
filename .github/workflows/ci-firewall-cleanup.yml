name: ci-firewall-cleanup

# Empties the CI firewall once a day, in case an ansible-cluster run could not close it (ADR 0005).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  close:
    runs-on: ubuntu-24.04
    environment: production-cluster
    steps:
      - uses: actions/checkout@v4

      # A running ansible-cluster job needs its rule, and closes it itself when it ends.
      - name: check for a running ansible-cluster
        id: ansible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ansible-cluster.yml \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: empty ci-ssh firewall
        if: steps.ansible.outputs.active == '0'
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: .github/scripts/ci-firewall.sh close
