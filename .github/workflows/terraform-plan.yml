name: terraform-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/dns/**"
      - "terraform/cluster/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # bootstrap is applied manually with the bucket project key (ADR 0003), never in CI.
        root: [dns, cluster]
    defaults:
      run:
        working-directory: terraform/${{ matrix.root }}
    # Read-only credentials only: a plan never writes. Each root uses the variables it declares.
    env:
      TF_IN_AUTOMATION: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_RO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_RO_SECRET_KEY }}
      TF_VAR_api_token: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_READ_TOKEN }}
      TF_VAR_source_ip: ${{ vars.TF_VAR_SOURCE_IP }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.1

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -no-color
