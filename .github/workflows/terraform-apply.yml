name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/dns/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read

jobs:
  apply-dns:
    runs-on: ubuntu-24.04
    environment: production
    # Option B (ADR 0003): Hetzner does not lock the state, so applies run one at a time.
    # Never cancel a running apply: it would leave resources created but missing from the state.
    concurrency:
      group: terraform-apply-dns
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/dns
    env:
      TF_IN_AUTOMATION: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_RW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_RW_SECRET_KEY }}
      TF_VAR_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.1
          # The wrapper echoes extra lines on stdout, which breaks piping `terraform show -json` into jq.
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      # Any delete fails the job, replacements included (actions ["delete","create"] or ["create","delete"]).
      - name: block deletions
        run: |
          deletes=$(terraform show -json tfplan | jq -r '.resource_changes[]? | select(any(.change.actions[]; . == "delete")) | "\(.change.actions | join("+")) \(.address)"')
          if [ -n "$deletes" ]; then
            echo "::error title=Deletion::The plan deletes or replaces resources in terraform/dns"
            echo "$deletes"
            exit 1
          fi
          echo "No deletion or replacement in terraform/dns."

      # Applies the plan checked above, nothing else.
      - name: terraform apply
        run: terraform apply -input=false -no-color tfplan
