- name: servers private network setup
  hosts: all
  become: true

  tasks:
    - name: private networks are read from the metadata service
      ansible.builtin.uri:
        url: http://169.254.169.254/hetzner/v1/metadata/private-networks
        return_content: true
      register: private_networks_metadata
      when: configure_private_network | default(false)

    # cloud-init configures this interface only once, at first boot: a server that reads
    # its metadata before the network was attached never gets it (klabs-worker-2, 24 Oct 2026)
    - name: private network is configured with dhcp
      vars:
        private_network: >-
          {{ private_networks_metadata.content | from_yaml | selectattr('ip', 'equalto', node_ip) | first }}
      ansible.builtin.copy:
        dest: /etc/netplan/60-private-network.yaml
        content: |
          network:
            version: 2
            ethernets:
              private:
                match:
                  macaddress: "{{ private_network.mac_address }}"
                dhcp4: true
        owner: root
        group: root
        mode: "0600"
      notify: Apply netplan
      when: configure_private_network | default(false)

    # Handlers normally wait for the end of the play: the check below needs netplan applied now
    - name: pending handlers run now
      ansible.builtin.meta: flush_handlers

    # DHCP takes a few seconds after netplan apply
    - name: ipv4 addresses are read
      ansible.builtin.command: ip -4 -brief address
      register: ipv4_addresses
      until: (node_ip ~ '/') in ipv4_addresses.stdout
      retries: 5
      delay: 3
      changed_when: false
      failed_when: false

    - name: play fails when node_ip is not configured on the host
      ansible.builtin.fail:
        msg: "{{ node_ip }} is not configured on any interface of {{ inventory_hostname }}"
      when: (node_ip ~ '/') not in ipv4_addresses.stdout

  handlers:
    - name: Apply netplan
      ansible.builtin.command: netplan apply

- name: containerd and kubeadm setup
  hosts: all
  become: true

  vars:
    containerd_version: "2.4.2"
    runc_version: "1.5.2"
    arch_map:
      aarch64: arm64
      x86_64: amd64
    arch: "{{ arch_map[ansible_facts['architecture']] }}"
    k8s_repository_version: "1.37"
    k8s_package_version: "{{ k8s_repository_version }}.1-1.1"

  tasks:
    - name: containerd tar exists
      ansible.builtin.get_url:
        url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-{{ arch }}.tar.gz"
        dest: "/tmp/containerd-{{ containerd_version }}-linux-{{ arch }}.tar.gz"
        mode: "0644"

    - name: containerd tar is untar
      ansible.builtin.unarchive:
        src: "/tmp/containerd-{{ containerd_version }}-linux-{{ arch }}.tar.gz"
        dest: "/usr/local"
        remote_src: true

    - name: containerd.service directory exists
      ansible.builtin.file:
        path: /usr/local/lib/systemd/system
        state: directory
        mode: "0755"

    - name: containerd.service is present
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/containerd/containerd/v{{ containerd_version }}/containerd.service
        dest: /usr/local/lib/systemd/system/containerd.service
        mode: "0644"
      notify:
        - Reload daemon
        - Restart containerd

    - name: containerd config directory exists
      ansible.builtin.file:
        path: /etc/containerd/
        state: directory
        mode: "0755"

    - name: containerd config.toml exists
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml
      notify: Restart containerd

    - name: containerd config SystemdCgroup is true
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup = false$'
        replace: '\1SystemdCgroup = true'
      notify: Restart containerd

    - name: runc is installed
      ansible.builtin.get_url:
        url: https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.{{ arch }}
        dest: /usr/local/sbin/runc
        mode: "0755"

    - name: containerd is enabled and started
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true
        state: started

    - name: net.ipv4.ip_forward value is 1
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/net-ipv4-forward.conf
        state: present
        reload: true

    - name: swap is disabled
      ansible.builtin.command: swapoff -a
      when: ansible_facts['swaptotal_mb'] > 0

    - name: swap configuration is commented in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: kubernetes repository is configured
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: https://pkgs.k8s.io/core:/stable:/v{{ k8s_repository_version }}/deb/
        suites: "/"
        signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_repository_version }}/deb/Release.key"

    - name: kubernetes packages are present
      ansible.builtin.apt:
        name:
          - "kubelet={{ k8s_package_version }}"
          - "kubeadm={{ k8s_package_version }}"
          - "kubectl={{ k8s_package_version }}"
        state: present
        update_cache: true

    - name: kubernetes packages are on-hold
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
        - kubernetes-cni

    - name: kubelet configuration is present
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        content: |
          KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }} --cloud-provider=external
        owner: root
        group: root
        mode: "0644"
      notify: Restart kubelet

    - name: kubelet is enabled and started
      ansible.builtin.systemd_service:
        name: kubelet
        state: started
        enabled: true

  handlers:
    - name: Reload daemon
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted

    - name: Restart kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        state: restarted

- name: kubeadm installation
  hosts: role_control_plane
  become: true

  vars:
    pod_network_cidr: 10.244.0.0/16

  tasks:
    - name: kubernetes admin conf exists
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_conf

    - name: apiserver is up and running
      ansible.builtin.command: >-
        curl --fail --silent --max-time 5 --cacert /etc/kubernetes/pki/ca.crt https://{{ node_ip }}:{{ cluster_endpoint_port }}/readyz
      register: apiserver_health
      until: apiserver_health.rc == 0
      retries: 5
      delay: 10
      failed_when: false
      changed_when: false
      when: kubeadm_conf.stat.exists

    - name: play fails when node is initialized but apiserver is not ready
      ansible.builtin.fail:
        msg: >-
          kube-apiserver exists but does not answer on /readyz
          Manual intervention needed
      when:
        - kubeadm_conf.stat.exists
        - apiserver_health.rc != 0

    - name: play ends here when node is already initialized and apiserver is healthy
      ansible.builtin.meta: end_host
      when: kubeadm_conf.stat.exists

    - name: node is initialized as a cluster
      ansible.builtin.command: >-
        kubeadm init
        --control-plane-endpoint {{ cluster_endpoint_host }}:{{ cluster_endpoint_port }}
        --pod-network-cidr {{ pod_network_cidr }}
        --apiserver-advertise-address {{ node_ip }}
        --skip-phases addon/kube-proxy
        --skip-token-print

- name: hetzner ccm secret setup
  hosts: role_control_plane
  become: true

  vars:
    # Ubuntu's python3-kubernetes (22.6.0) is older than kubernetes.core needs (>= 24.2.0),
    # and pip is blocked in the system Python (PEP 668): the library lives in its own venv.
    k8s_python_venv: /opt/ansible-k8s-venv
    k8s_python_version: "37.0.1"

  tasks:
    - name: python venv package is present
      ansible.builtin.apt:
        name: python3-venv
        state: present

    - name: kubernetes python library is present
      ansible.builtin.pip:
        name: "kubernetes=={{ k8s_python_version }}"
        virtualenv: "{{ k8s_python_venv }}"
        virtualenv_command: python3 -m venv

    - name: play fails when HCLOUD_CCM_TOKEN is not set
      ansible.builtin.fail:
        msg: "HCLOUD_CCM_TOKEN is not set"
      when: lookup('env', 'HCLOUD_CCM_TOKEN') | trim == ""

    - name: hetzner ccm secret is created
      vars:
        ansible_python_interpreter: "{{ k8s_python_venv }}/bin/python"
      kubernetes.core.k8s:
        kubeconfig: /etc/kubernetes/admin.conf
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: hcloud
            namespace: kube-system
          stringData:
            token: "{{ lookup('env', 'HCLOUD_CCM_TOKEN') | trim }}"
      no_log: true

- name: cilium installation
  hosts: role_control_plane
  become: true

  vars:
    helm_version: "3.22.1"
    cilium_version: "1.20.3"
    arch_map:
      aarch64: arm64
      x86_64: amd64
    arch: "{{ arch_map[ansible_facts['architecture']] }}"

  tasks:
    - name: helm tar exists
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ arch }}.tar.gz"
        dest: "/tmp/helm-v{{ helm_version }}-linux-{{ arch }}.tar.gz"
        checksum: "sha256:https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ arch }}.tar.gz.sha256sum"
        mode: "0644"

    - name: helm directory exists
      ansible.builtin.file:
        path: "/opt/helm-v{{ helm_version }}"
        state: directory
        mode: "0755"

    - name: helm tar is untar
      ansible.builtin.unarchive:
        src: "/tmp/helm-v{{ helm_version }}-linux-{{ arch }}.tar.gz"
        dest: "/opt/helm-v{{ helm_version }}"
        remote_src: true
        creates: "/opt/helm-v{{ helm_version }}/linux-{{ arch }}/helm"

    - name: helm is in the PATH
      ansible.builtin.file:
        src: "/opt/helm-v{{ helm_version }}/linux-{{ arch }}/helm"
        dest: /usr/local/bin/helm
        state: link

    - name: cilium is installed
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        release_name: cilium
        release_namespace: kube-system
        chart_repo_url: https://helm.cilium.io/
        chart_ref: cilium
        chart_version: "{{ cilium_version }}"
        values:
          # No kube-proxy: Cilium reaches the API directly, not through 10.96.0.1.
          kubeProxyReplacement: true
          k8sServiceHost: "{{ cluster_endpoint_host }}"
          k8sServicePort: "{{ cluster_endpoint_port }}"
          # Pod IPs come from the per-node ranges kubeadm cut from --pod-network-cidr.
          ipam:
            mode: kubernetes
          hubble:
            relay:
              enabled: true
            ui:
              enabled: true
          operator:
            replicas: 1

- name: hetzner ccm deployment
  hosts: role_control_plane
  become: true

  vars:
    hcloud_ccm_version: "1.39.1"
    # Same range as kubeadm init --pod-network-cidr (ADR 0006).
    pod_network_cidr: 10.244.0.0/16

  tasks:
    - name: hetzner ccm is installed
      kubernetes.core.helm:
        kubeconfig: /etc/kubernetes/admin.conf
        release_name: hcloud-ccm
        release_namespace: kube-system
        chart_repo_url: https://charts.hetzner.cloud/
        chart_ref: hcloud-cloud-controller-manager
        chart_version: "{{ hcloud_ccm_version }}"
        values:
          # Kubelets announce their private IP (--node-ip): without the network, the CCM only
          # knows the public addresses and never initializes the nodes.
          networking:
            enabled: true
            clusterCIDR: "{{ pod_network_cidr }}"
            # The network name is not a secret: the hcloud Secret keeps its token only.
            network:
              value: "{{ hcloud_network | default('') }}"
              valueFrom: null
          # Cilium keeps its VXLAN tunnel, no routes in the Hetzner network (ADR 0007).
          env:
            HCLOUD_NETWORK_ROUTES_ENABLED:
              value: "false"

- name: join command for workers node
  hosts: role_control_plane
  become: true

  tasks:
    - name: kubeadm join command is generated
      ansible.builtin.command: kubeadm token create --print-join-command --ttl 10m
      register: kubeadm_join_command
      changed_when: false
      no_log: true

- name: workers node registration in the cluster
  hosts: role_worker
  become: true

  vars:
    control_plane: "{{ groups['role_control_plane'][0] }}"
    kubelet_host: 127.0.0.1
    kubelet_port: 10248

  tasks:
    - name: kubelet conf exists
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: kubelet is up and running
      ansible.builtin.command: >-
        curl --fail --silent --max-time 5 http://{{ kubelet_host }}:{{ kubelet_port }}/healthz
      register: kubelet_health
      until: kubelet_health.rc == 0
      retries: 5
      delay: 10
      failed_when: false
      changed_when: false
      when: kubelet_conf.stat.exists

    - name: play fails when kubelet is not ready
      ansible.builtin.fail:
        msg: >-
          kubelet exists but does not answer on /healthz.
          Manual intervention needed
      when:
        - kubelet_conf.stat.exists
        - kubelet_health.rc != 0

    - name: play ends here when node joined the cluster and kubelet is healthy
      ansible.builtin.meta: end_host
      when: kubelet_conf.stat.exists

    - name: node joined the cluster
      ansible.builtin.command: >-
        {{ hostvars[control_plane]['kubeadm_join_command']['stdout'] }}
      no_log: true
