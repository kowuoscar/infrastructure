plugin: hetzner.hcloud.hcloud

connect_with: public_ipv4

compose:
  ansible_user: "'root'"
  node_ip: hcloud_private_networks[0].ip
  cluster_endpoint_host: "'k8s-api.kowulabs.com'"
  cluster_endpoint_port: "6443"
  configure_private_network: "true"

keyed_groups:
  - key: hcloud_location
    prefix: dc
  - key: hcloud_labels.role
    prefix: role
